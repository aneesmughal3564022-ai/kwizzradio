<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="reggaeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00a859"/>
      <stop offset="50%" stop-color="#ffd100"/>
      <stop offset="100%" stop-color="#ff384e"/>
    </linearGradient>
    <radialGradient id="vinylGleam" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a2a2a"/>
      <stop offset="50%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#050505"/>
    </radialGradient>
  </defs>

  <!-- Background Vinyl Record -->
  <rect width="400" height="400" fill="#09090b" rx="24"/>
  <circle cx="200" cy="200" r="175" fill="url(#vinylGleam)" stroke="#27272a" stroke-width="3"/>
  
  <!-- Grooves -->
  <circle cx="200" cy="200" r="150" fill="none" stroke="#222" stroke-width="1.5" stroke-dasharray="8 4"/>
  <circle cx="200" cy="200" r="125" fill="none" stroke="#1f1f1f" stroke-width="1.5"/>
  <circle cx="200" cy="200" r="100" fill="none" stroke="#262626" stroke-width="1.5" stroke-dasharray="12 6"/>
  <circle cx="200" cy="200" r="75" fill="none" stroke="#222" stroke-width="1.5"/>

  <!-- Center Label -->
  <circle cx="200" cy="200" r="62" fill="#000000" stroke="url(#reggaeGrad)" stroke-width="4"/>
  <circle cx="200" cy="200" r="12" fill="#ffd100"/>
  <circle cx="200" cy="200" r="5" fill="#000000"/>

  <!-- Branding Text -->
  <text x="200" y="172" font-family="system-ui, sans-serif" font-weight="900" font-size="16" fill="#ffd100" text-anchor="middle" letter-spacing="3">KWIZZ</text>
  <text x="200" y="235" font-family="system-ui, sans-serif" font-weight="700" font-size="10" fill="#ffffff" text-anchor="middle" letter-spacing="2">RADIO</text>
  <text x="200" y="250" font-family="system-ui, sans-serif" font-weight="600" font-size="8" fill="#a1a1aa" text-anchor="middle" letter-spacing="1">OTTAWA</text>
</svg>

